<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #222a2d;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: #222a2d;
  --progress-bar-color: #bacf4f;
}

.texto {
  position: absolute;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.6);
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  pointer-events: none;
}

</style>

</head>

<body>

<model-viewer
  id="visor"
  camera-controls
  auto-rotate
  auto-rotate-delay="2500"
  rotation-per-second="4deg"
  shadow-intensity="1"
  shadow-softness="1"
  exposure="1"
  environment-image="neutral"
  interaction-prompt="none">
</model-viewer>

<div class="texto">
ARRASTRÁ PARA EXPLORAR
</div>

<script
type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<script>

const parametros = new URLSearchParams(window.location.search);

let modelo = parametros.get("modelo");

if (!modelo) {
  modelo = "Modelos-3d.glb";
}

document.getElementById("visor").src = modelo;

</script>

</body>

</html>
